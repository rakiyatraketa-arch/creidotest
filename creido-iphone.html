<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>creido на iPhone</title>
<style>
:root {
  --sheet: #eaebec;
  --edge: rgba(0, 0, 0, 0.14);
  --text: #111111;
  --dim: rgba(0, 0, 0, 0.52);
}
@media (prefers-color-scheme: dark) {
  :root {
    --sheet: #131313;
    --edge: rgba(255, 255, 255, 0.16);
    --text: #f4f4f4;
    --dim: rgba(255, 255, 255, 0.56);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: var(--sheet);
  background-image: radial-gradient(90% 70% at 50% 0%, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0) 70%);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overflow: auto;
}
@media (prefers-color-scheme: dark) {
  body { background-image: radial-gradient(90% 70% at 50% 0%, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0) 70%); }
}
.stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  transform: scale(var(--scale, 1));
  transform-origin: center center;
}
.phone {
  position: relative;
  width: 413px;
  height: 872px;
  padding: 10px;
  border-radius: 58px;
  background: #0a0a0a;
  box-shadow:
    0 0 0 2px #3c3c3c,
    0 0 0 4px #7a7a7a,
    0 0 0 6px #2a2a2a,
    0 34px 70px rgba(0, 0, 0, 0.34),
    inset 0 0 0 1px rgba(255, 255, 255, 0.06);
}
.screen {
  position: relative;
  width: 393px;
  height: 852px;
  border-radius: 47px;
  overflow: hidden;
  background: #ffffff;
}
.screen iframe {
  display: block;
  width: 393px;
  height: 852px;
  border: 0;
}
.island {
  position: absolute;
  z-index: 3;
  top: 11px;
  left: 50%;
  margin-left: -62px;
  width: 124px;
  height: 36px;
  border-radius: 20px;
  background: #000000;
  pointer-events: none;
}
.key {
  position: absolute;
  border-radius: 2px;
  background: linear-gradient(180deg, #606060, #2b2b2b);
}
.key--action { left: -5px; top: 156px; width: 5px; height: 32px; }
.key--up { left: -5px; top: 226px; width: 5px; height: 62px; }
.key--down { left: -5px; top: 300px; width: 5px; height: 62px; }
.key--power { right: -5px; top: 250px; width: 5px; height: 100px; }
.meta {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  color: var(--dim);
}
.seg {
  display: flex;
  gap: 3px;
  padding: 3px;
  border: 1px solid var(--edge);
  border-radius: 11px;
}
.seg button {
  font: inherit;
  font-size: 13px;
  padding: 6px 13px;
  border: 0;
  border-radius: 8px;
  background: none;
  color: var(--dim);
  cursor: pointer;
  transition: background-color 200ms ease, color 200ms ease;
}
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--sheet); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="phone">
    <span class="key key--action"></span>
    <span class="key key--up"></span>
    <span class="key key--down"></span>
    <span class="key key--power"></span>
    <div class="screen">
      <iframe id="screen" title="creido — экран iPhone"></iframe>
      <span class="island"></span>
    </div>
  </div>
  <div class="meta">
    <span>iPhone 15 Pro · 393 × 852 pt</span>
    <span class="seg" role="group" aria-label="Тема">
      <button type="button" data-theme="light" aria-pressed="true">белая</button>
      <button type="button" data-theme="dark" aria-pressed="false">чёрная</button>
    </span>
  </div>
</div>

<script>
;(function () {
  var OPEN = "<" + "script>"
  var CLOSE = "<" + "/script>"

  function decode(b64) {
    var bin = atob(b64)
    var bytes = new Uint8Array(bin.length)
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i)
    return new TextDecoder("utf-8").decode(bytes)
  }

  var appHtml = decode(document.getElementById("app-html").textContent.replace(/\s+/g, ""))
  var iosChrome = document.getElementById("ios-chrome").innerHTML
  var frame = document.getElementById("screen")
  var buttons = [].slice.call(document.querySelectorAll(".seg button"))

  /* В ифрейм идёт реальный билд: свой viewport 393×852, рабочие media-запросы,
     фиксированный dock и подставленные safe-area как на устройстве с островом. */
  function render(theme) {
    var html = appHtml
      .replace("<head>", "<head>" + OPEN + 'window.__CREIDO_THEME__="' + theme + '";' + CLOSE)
      .replace("</head>", "<style>:root{--safe-top:59px;--safe-bottom:34px}</style></head>")
      .replace("</body>", iosChrome + "</body>")
    frame.srcdoc = html
    buttons.forEach(function (button) {
      button.setAttribute("aria-pressed", String(button.dataset.theme === theme))
    })
  }

  var requested = new URLSearchParams(location.search).get("theme")
  var initial =
    requested === "dark" || requested === "light"
      ? requested
      : window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light"
  render(initial)

  buttons.forEach(function (button) {
    button.addEventListener("click", function () { render(button.dataset.theme) })
  })

  /* Масштаб под контейнер: в Notion-эмбеде телефон целиком влезает в кадр. */
  var stage = document.getElementById("stage")
  function fit() {
    var scale = Math.min((window.innerWidth - 56) / 413, (window.innerHeight - 56) / 936)
    stage.style.setProperty("--scale", Math.max(0.3, Math.min(1.04, scale)).toFixed(3))
  }
  window.addEventListener("resize", fit, { passive: true })
  fit()
})()
</script>
